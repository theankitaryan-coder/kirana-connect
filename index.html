<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirana Connect – Bharti Retail Chain</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="shop">
  <div class="wrap">
    <div>
      <h1 id="shopName"></h1>
      <p id="shopTagline"></p>
      <p>📍 <span id="shopAddress"></span> · 🕖 <span id="shopTimings"></span></p>
    </div>
    <a id="callBtn" class="btn btn-light" href="#">📞 Call shop</a>
  </div>
</header>
<main>
  <div class="toolbar">
    <div class="chips" id="categoryChips"></div>
  </div>
  <p class="count" id="productCount"></p>
  <section class="grid" id="productGrid"></section>
</main>
<footer>Kirana Connect · Online ordering for your neighbourhood store</footer>
<script src="data/store.js"></script>
<script src="data/products.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
